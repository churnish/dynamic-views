name: Tests

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '.gitignore'
      - 'LICENSE'
      - 'archive/**'
      - 'docs/**'
      - 'version-bump.mjs'
  pull_request:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '.gitignore'
      - 'LICENSE'
      - 'archive/**'
      - 'docs/**'
      - 'version-bump.mjs'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npm run lint

      # esbuild strips types without checking them, so nothing else in the
      # pipeline would notice a type error.
      - run: npx tsc --noEmit

      - run: npm test

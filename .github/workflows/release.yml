name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Gated here rather than via `needs:` on the Tests workflow: that one is
      # triggered by branch pushes, so a tag push never runs it and there would
      # be nothing to depend on. Without these steps a tag ships whatever it is
      # given — esbuild strips types without checking them.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit all changes to repo
        run: |
          git config user.name "churnish"
          git config user.email "183069544+churnish@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit; build outputs are gitignored."
            exit 0
          fi
          git commit -m "build: Update repository for ${GITHUB_REF_NAME}"
          # main can advance between postversion's push and this job starting, so rebase rather than fail the release on a race it can recover from.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, skipping release notes."
            echo "BODY=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SINCE=$(TZ=UTC0 git log -1 --format='%ad' --date=iso-strict-local "$PREV_TAG" | sed 's/+00:00$/Z/')

          PRS=$(gh pr list --state merged --search "merged:>=${SINCE}" --limit 200 \
            --json number,title,author \
            --jq '.[] | "- \(.title) #\(.number) by @\(.author.login)"')

          ISSUES_JSON=$(gh issue list --state closed --limit 200 \
            --json number,title,closedAt,stateReason,labels \
            --jq "[.[] | select(.stateReason == \"COMPLETED\" and .closedAt >= \"${SINCE}\")]")

          FEATURES=$(echo "$ISSUES_JSON" | jq -r \
            '[.[] | select((.labels | map(.name)) as $n | ($n | index("Feature request")) and ($n | index("Bug report") | not))] | .[] | "- \(.title) #\(.number)"')

          BUGS=$(echo "$ISSUES_JSON" | jq -r \
            '[.[] | select((.labels | map(.name)) as $n | ($n | index("Bug report")) and ($n | index("Feature request") | not))] | .[] | "- \(.title) #\(.number)"')

          BODY=""
          append_section() {
            local heading="$1" content="$2"
            if [ -n "$content" ]; then
              if [ -n "$BODY" ]; then
                printf -v BODY '%s\n\n### %s\n\n%s' "$BODY" "$heading" "$content"
              else
                printf -v BODY '### %s\n\n%s' "$heading" "$content"
              fi
            fi
          }
          append_section "Merged PRs" "$PRS"
          append_section "Enhancements" "$FEATURES"
          append_section "Fixes" "$BUGS"

          {
            echo 'BODY<<EOF'
            echo "$BODY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect attestation subjects
        id: subjects
        run: |
          SUBJECTS=$'main.js\nmanifest.json'
          # Not every plugin ships a stylesheet, and attest-build-provenance hard-fails on a
          # missing subject path rather than warning — so styles.css is only listed if built.
          if [ -f styles.css ]; then
            SUBJECTS=$'main.js\nmanifest.json\nstyles.css'
          fi
          {
            echo 'PATHS<<EOF'
            echo "$SUBJECTS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.subjects.outputs.PATHS }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          body: ${{ steps.notes.outputs.BODY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
